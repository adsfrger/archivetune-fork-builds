name: Repackage ArchiveTune Fork (Dual Install)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

env:
  UPSTREAM_REPO: rukamori/ArchiveTune

  # Upstream APK package
  ORIGINAL_PACKAGE: moe.rukamori.archivetune

  # Fork APK package
  NEW_PACKAGE: moe.rukamori.archivetune.fork

  NEW_APP_LABEL: "AT-Fork"

jobs:
  repackage:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ============================================================
      # 1. Find latest stable upstream GMS mobile APK.
      #
      # Priority:
      #   1. app-gms-mobile-universal-release.apk
      #   2. app-gms-mobile-arm64-release.apk
      #   3. any other app-gms-mobile-*.apk
      #
      # FOSS / TV are never selected.
      # ============================================================
      - name: Find latest upstream release + APK asset
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          latest="$(
            curl -fsSL \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=10" |
            jq -c '
              map(select(.draft == false and .prerelease == false))[0]
            '
          )"

          if [ "$latest" = "null" ] || [ -z "$latest" ]; then
            echo "::error::No stable upstream release found."
            exit 1
          fi

          tag="$(echo "$latest" | jq -r '.tag_name')"

          asset="$(
            echo "$latest" |
            jq -c '
              (.assets | map(select(.name == "app-gms-mobile-universal-release.apk")))[0] //
              (.assets | map(select(.name == "app-gms-mobile-arm64-release.apk")))[0] //
              (.assets | map(select(.name | test("^app-gms-mobile-.*\\.apk$"))))[0] //
              null
            '
          )"

          if [ "$asset" = "null" ] || [ -z "$asset" ]; then
            echo "::error::No GMS mobile APK asset found in release ${tag}"
            echo "::error::Available assets:"
            echo "$latest" | jq -r '.assets[].name'
            exit 1
          fi

          apk_name="$(echo "$asset" | jq -r '.name')"
          apk_url="$(echo "$asset" | jq -r '.browser_download_url')"
          apk_digest="$(echo "$asset" | jq -r '.digest // empty')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "apk_url=$apk_url" >> "$GITHUB_OUTPUT"
          echo "apk_digest=$apk_digest" >> "$GITHUB_OUTPUT"

          echo "Release: $tag"
          echo "Selected asset: $apk_name"
          echo "APK: $apk_url"

          if [ -n "$apk_digest" ]; then
            echo "Expected digest: $apk_digest"
          fi

      # ============================================================
      # 2. Skip versions already published by this fork.
      # ============================================================
      - name: Skip if this version was already repackaged
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view \
            "${{ steps.upstream.outputs.tag }}" \
            --repo "${{ github.repository }}" >/dev/null 2>&1
          then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already repackaged. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version detected."
          fi

      # ============================================================
      # 3. Download + integrity check.
      # ============================================================
      - name: Download upstream APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          echo "Downloading: ${{ steps.upstream.outputs.apk_name }}"

          curl -fL \
            -o original.apk \
            "${{ steps.upstream.outputs.apk_url }}"

          test -s original.apk
          ls -lh original.apk

          EXPECTED="${{ steps.upstream.outputs.apk_digest }}"
          if [ -n "$EXPECTED" ]; then
            ACTUAL="sha256:$(sha256sum original.apk | awk '{print $1}')"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"

            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::SHA256 mismatch."
              exit 1
            fi

            echo "Checksum verification PASSED."
          else
            echo "No digest metadata from GitHub API; skipping checksum verification."
          fi

      # ============================================================
      # 4. Java
      # ============================================================
      - name: Set up JDK 17
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ============================================================
      # 5. Android SDK + Apktool
      # ============================================================
      - name: Set up Android SDK
        if: steps.check.outputs.skip == 'false'
        uses: android-actions/setup-android@v3

      - name: Install build-tools and apktool
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          sdkmanager \
            "build-tools;34.0.0" \
            --sdk_root="$ANDROID_SDK_ROOT"

          APKTOOL_URL="$(
            curl -fsSL \
              https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |
            jq -r '
              [
                .assets[]
                | select(.name | test("\\.jar$"; "i"))
              ][0].browser_download_url
            '
          )"

          if [ "$APKTOOL_URL" = "null" ] || [ -z "$APKTOOL_URL" ]; then
            echo "::error::Could not find Apktool."
            exit 1
          fi

          curl -fsSL \
            -o apktool.jar \
            "$APKTOOL_URL"

          java -jar apktool.jar --version

      # ============================================================
      # 6. Verify upstream package.
      # ============================================================
      - name: Verify upstream package
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          PACKAGE="$(
            "$BT/aapt" dump badging original.apk |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          echo "Detected: $PACKAGE"
          echo "Expected: ${ORIGINAL_PACKAGE}"

          if [ "$PACKAGE" != "${ORIGINAL_PACKAGE}" ]; then
            echo "::error::Unexpected upstream package."
            exit 1
          fi

      # ============================================================
      # 7. Decompile.
      # ============================================================
      - name: Decompile APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          java -jar apktool.jar \
            d original.apk \
            -o decoded \
            -f

      # ============================================================
      # 8. Patch install identity.
      #
      # IMPORTANT:
      # ArchiveTune's community icon system generates:
      #
      #   catalog.json:
      #     aliasClassName = <applicationId>.launcher.IconAlias<hash>
      #
      # and a matching manifest alias with the same applicationId.
      #
      # The old workflow changed only the manifest package, leaving
      # catalog.json pointing at moe.rukamori.archivetune.*.
      # That makes community icon selection resolve to the wrong
      # package namespace and is the reason the icons cannot be used
      # correctly in the fork.
      #
      # We therefore patch BOTH:
      #   A. manifest package / provider / permission references
      #   B. icon_pack/catalog.json aliasClassName
      #   C. generated launcher aliases in the manifest
      #
      # We DO NOT rename Kotlin/Java class packages.
      # This is intentional: Android component classes remain valid
      # because normal app components are referenced relative to the
      # manifest/application package, while IconAlias names are
      # generated as fully-qualified component class names and must
      # match the new package ID exactly.
      # ============================================================
      - name: Patch install identity + community icon namespace
        if: steps.check.outputs.skip == 'false'
        env:
          ORIGINAL_PACKAGE: ${{ env.ORIGINAL_PACKAGE }}
          NEW_PACKAGE: ${{ env.NEW_PACKAGE }}
          NEW_APP_LABEL: ${{ env.NEW_APP_LABEL }}
        run: |
          set -euo pipefail

          MANIFEST="decoded/AndroidManifest.xml"
          CATALOG="decoded/assets/icon_pack/catalog.json"

          test -f "$MANIFEST"
          test -f "$CATALOG"

          OLD_ESCAPED="${ORIGINAL_PACKAGE//./\\.}"

          echo "=== BEFORE: package-related lines ==="
          grep -nE \
            'package=|android:authorities=|<permission|android:permission=|IconAlias|DefaultIconAlias' \
            "$MANIFEST" || true

          echo "=== BEFORE: catalog alias namespace ==="
          grep -o '"aliasClassName"[[:space:]]*:[[:space:]]*"[^"]*"' "$CATALOG" | head -20 || true

          # ----------------------------------------------------------
          # A. Manifest package.
          # ----------------------------------------------------------
          sed -i \
            "s/package=\"${ORIGINAL_PACKAGE}\"/package=\"${NEW_PACKAGE}\"/" \
            "$MANIFEST"

          # ----------------------------------------------------------
          # B. Provider authorities and permission namespaces.
          # ----------------------------------------------------------
          sed -i \
            "/android:authorities=/ s/${OLD_ESCAPED}\\./${NEW_PACKAGE}./g" \
            "$MANIFEST"

          sed -i \
            "/<permission\\b/ s/${OLD_ESCAPED}\\./${NEW_PACKAGE}./g; \
             /<uses-permission\\b/ s/${OLD_ESCAPED}\\./${NEW_PACKAGE}./g; \
             /android:permission=/ s/${OLD_ESCAPED}\\./${NEW_PACKAGE}./g" \
            "$MANIFEST"

          # ----------------------------------------------------------
          # C. Community icon catalog.
          #
          # This is the critical missing patch in the old workflow.
          # The catalog is runtime data, not merely documentation.
          # ----------------------------------------------------------
          python3 - "$CATALOG" "$ORIGINAL_PACKAGE" "$NEW_PACKAGE" <<'PY'
          import json
          import sys
          from pathlib import Path

          catalog_path = Path(sys.argv[1])
          old_package = sys.argv[2]
          new_package = sys.argv[3]

          data = json.loads(catalog_path.read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("catalog.json must contain a JSON array")

          changed = 0

          for entry in data:
              if not isinstance(entry, dict):
                  raise SystemExit("catalog.json contains a non-object entry")

              alias = entry.get("aliasClassName")
              if isinstance(alias, str) and alias.startswith(old_package + "."):
                  entry["aliasClassName"] = new_package + alias[len(old_package):]
                  changed += 1

          if changed == 0:
              raise SystemExit(
                  f"No catalog aliasClassName entries used {old_package}. "
                  "Refusing to silently continue."
              )

          catalog_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
          )

          print(f"Patched {changed} catalog aliasClassName entries.")
          PY

          # ----------------------------------------------------------
          # D. App label for every locale.
          # ----------------------------------------------------------
          while IFS= read -r -d '' f; do
            if grep -q '<string name="app_name">' "$f"; then
              sed -i \
                "s#<string name=\"app_name\">[^<]*</string>#<string name=\"app_name\">${NEW_APP_LABEL}</string>#" \
                "$f"
            fi
          done < <(find decoded/res -type f -name strings.xml -print0)

          # ----------------------------------------------------------
          # E. Validate package + catalog consistency.
          # ----------------------------------------------------------
          if ! grep -q "package=\"${NEW_PACKAGE}\"" "$MANIFEST"; then
            echo "::error::Manifest package was not changed."
            exit 1
          fi

          if grep -q "package=\"${ORIGINAL_PACKAGE}\"" "$MANIFEST"; then
            echo "::error::Original package still exists as manifest package."
            exit 1
          fi

          if grep -q "\"aliasClassName\".*\"${ORIGINAL_PACKAGE}\\.launcher\\." "$CATALOG"; then
            echo "::error::Catalog still contains original icon alias package."
            exit 1
          fi

          if ! grep -q "\"aliasClassName\".*\"${NEW_PACKAGE}\\.launcher\\." "$CATALOG"; then
            echo "::error::Catalog does not contain fork icon alias package."
            exit 1
          fi

          echo "=== AFTER: package-related lines ==="
          grep -nE \
            'package=|android:authorities=|<permission|android:permission=|IconAlias|DefaultIconAlias' \
            "$MANIFEST" || true

          echo "=== AFTER: catalog alias namespace ==="
          grep -o '"aliasClassName"[[:space:]]*:[[:space:]]*"[^"]*"' "$CATALOG" | head -20 || true

          echo "Install identity + community icon namespace patch PASSED."

      # ============================================================
      # 9. Rebuild.
      # ============================================================
      - name: Rebuild APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          java -jar apktool.jar \
            b decoded \
            -o unsigned.apk

          test -s unsigned.apk
          ls -lh unsigned.apk

      # ============================================================
      # 10. Verify rebuilt package.
      # ============================================================
      - name: Verify rebuilt package
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          "$BT/aapt" dump badging unsigned.apk |
            grep "^package:"

          PACKAGE="$(
            "$BT/aapt" dump badging unsigned.apk |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          echo "Rebuilt package: $PACKAGE"

          if [ "$PACKAGE" != "${NEW_PACKAGE}" ]; then
            echo "::error::Rebuilt APK has wrong package."
            echo "Expected: ${NEW_PACKAGE}"
            echo "Actual:   ${PACKAGE}"
            exit 1
          fi

          echo "Package verification PASSED."

      # ============================================================
      # 11. Verify GMS build characteristics.
      # ============================================================
      - name: Verify GMS features are present
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          MANIFEST="decoded/AndroidManifest.xml"

          if ! grep -q \
            "com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" \
            "$MANIFEST"
          then
            echo "::error::Cast support is missing from this build."
            echo "::error::The selected asset may not be the GMS variant."
            exit 1
          fi

          echo "GMS Cast support confirmed present."

      # ============================================================
      # 12. Verify icon catalog AFTER rebuild source patch.
      # ============================================================
      - name: Verify community icon catalog
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          if ! unzip -p unsigned.apk assets/icon_pack/catalog.json |
            grep -q "\"aliasClassName\".*\"${NEW_PACKAGE}\\.launcher\\."
          then
            echo "::error::Community icon catalog still points outside the fork package."
            exit 1
          fi

          if unzip -p unsigned.apk assets/icon_pack/catalog.json |
            grep -q "\"aliasClassName\".*\"${ORIGINAL_PACKAGE}\\.launcher\\."
          then
            echo "::error::Original community icon alias namespace remains in final APK."
            exit 1
          fi

          echo "Community icon catalog verification PASSED."

      # ============================================================
      # 13. Restore signing key.
      # ============================================================
      - name: Restore signing key
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          echo "${{ secrets.KEYSTORE_BASE64 }}" |
            base64 -d > release.jks

          test -s release.jks

      # ============================================================
      # 14. Zipalign.
      # ============================================================
      - name: Zipalign
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          "$BT/zipalign" \
            -p \
            -f \
            4 \
            unsigned.apk \
            aligned.apk

      # ============================================================
      # 15. Sign.
      # ============================================================
      - name: Sign APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          OUTPUT="ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk"

          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$OUTPUT" \
            aligned.apk

          test -s "$OUTPUT"

      # ============================================================
      # 16. Final APK verification.
      # ============================================================
      - name: Final APK verification
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          OUTPUT="ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk"

          "$BT/apksigner" verify --verbose "$OUTPUT"

          PACKAGE="$(
            "$BT/aapt" dump badging "$OUTPUT" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          LABEL="$(
            "$BT/aapt" dump badging "$OUTPUT" |
            sed -n "s/.*application-label:'\([^']*\)'.*/\1/p"
          )"

          echo "Final package: $PACKAGE"
          echo "Final label:   $LABEL"

          if [ "$PACKAGE" != "${NEW_PACKAGE}" ]; then
            echo "::error::Final APK package is wrong."
            exit 1
          fi

          if [ "$LABEL" != "${NEW_APP_LABEL}" ]; then
            echo "::error::Final APK label is wrong."
            exit 1
          fi

          echo "=== Final community icon catalog ==="
          unzip -p "$OUTPUT" assets/icon_pack/catalog.json |
            grep -o '"aliasClassName"[[:space:]]*:[[:space:]]*"[^"]*"' |
            head -20

          if unzip -p "$OUTPUT" assets/icon_pack/catalog.json |
            grep -q "\"aliasClassName\".*\"${ORIGINAL_PACKAGE}\\.launcher\\."
          then
            echo "::error::Original package remains in final community icon catalog."
            exit 1
          fi

          echo "Final APK verification PASSED."

          sha256sum "$OUTPUT" | tee final-sha256.txt

      # ============================================================
      # 17. Publish release.
      # ============================================================
      - name: Publish to this repo's Releases
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: "ArchiveTune Fork ${{ steps.upstream.outputs.tag }}"
          body: |
            Repackaged from upstream asset:
            `${{ steps.upstream.outputs.apk_name }}`

            Upstream repository:
            https://github.com/rukamori/ArchiveTune

            Fork package:
            `${{ env.NEW_PACKAGE }}`

            Community icon catalog namespace:
            `${{ env.NEW_PACKAGE }}.launcher.*`

            This build keeps the upstream GMS mobile APK contents and changes
            only the installation identity / app label / package-dependent
            runtime icon alias namespace required for dual installation.
          files: |
            ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk
            final-sha256.txt
