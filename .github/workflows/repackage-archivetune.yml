name: Repackage ArchiveTune Fork (Dual Install)
true:
  schedule:
  - cron: 0 * * * *
  workflow_dispatch: {}
env:
  UPSTREAM_REPO: rukamori/ArchiveTune
  ORIGINAL_PACKAGE: moe.rukamori.archivetune
  NEW_PACKAGE: moe.rukamori.archivetune.fork
  NEW_APP_LABEL: ArchiveTune Fork
jobs:
  repackage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Find latest upstream release + APK asset
      id: upstream
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\n\nlatest=\"$(\n  curl -fsSL \\\n    \"https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=10\"\
        \ |\n  jq -c \"map(select(.draft == false and .prerelease == false))[0]\"\n)\"\n\nif [ \"$latest\" = \"null\" ] ||\
        \ [ -z \"$latest\" ]; then\n  echo \"::error::No stable upstream release found.\"\n  exit 1\nfi\n\ntag=\"$(echo \"\
        $latest\" | jq -r \".tag_name\")\"\n\n# universal APKを優先\napk_url=\"$(\n  echo \"$latest\" |\n  jq -r \"[.assets[]\
        \ | select(.name | test(\\\"universal.*\\\\\\\\.apk$\\\"; \\\"i\\\"))][0].browser_download_url\"\n)\"\n\n# なければ任意のAPK\n\
        if [ \"$apk_url\" = \"null\" ] || [ -z \"$apk_url\" ]; then\n  apk_url=\"$(\n    echo \"$latest\" |\n    jq -r \"\
        [.assets[] | select(.name | test(\\\"\\\\\\\\.apk$\\\"; \\\"i\\\"))][0].browser_download_url\"\n  )\"\nfi\n\nif [\
        \ \"$apk_url\" = \"null\" ] || [ -z \"$apk_url\" ]; then\n  echo \"::error::No APK asset found in release ${tag}\"\
        \n  exit 1\nfi\n\necho \"tag=$tag\" >> \"$GITHUB_OUTPUT\"\necho \"apk_url=$apk_url\" >> \"$GITHUB_OUTPUT\"\n\necho\
        \ \"Release: $tag\"\necho \"APK: $apk_url\""
    - name: Skip if this version was already repackaged
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "set -euo pipefail\n\nif gh release view \\\n  \"${{ steps.upstream.outputs.tag }}\" \\\n  --repo \"${{ github.repository\
        \ }}\" >/dev/null 2>&1\nthen\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"Already repackaged. Skipping.\"\
        \nelse\n  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"New version detected.\"\nfi\n"
    - name: Download upstream APK
      if: steps.check.outputs.skip == 'false'
      run: "set -euo pipefail\n\ncurl -fL \\\n  -o original.apk \\\n  \"${{ steps.upstream.outputs.apk_url }}\"\n\ntest -s\
        \ original.apk\nls -lh original.apk\n"
    - name: Set up JDK 17
      if: steps.check.outputs.skip == 'false'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Set up Android SDK
      if: steps.check.outputs.skip == 'false'
      uses: android-actions/setup-android@v3
    - name: Install build-tools and apktool
      if: steps.check.outputs.skip == 'false'
      run: "set -euo pipefail\n\nsdkmanager \\\n  \"build-tools;34.0.0\" \\\n  --sdk_root=\"$ANDROID_SDK_ROOT\"\n\nAPKTOOL_URL=\"\
        $(\n  curl -fsSL \\\n    https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |\n  jq -r '\n    [\n  \
        \    .assets[]\n      | select(.name | test(\"\\\\.jar$\"; \"i\"))\n    ][0].browser_download_url\n  '\n)\"\n\nif\
        \ [ \"$APKTOOL_URL\" = \"null\" ] || [ -z \"$APKTOOL_URL\" ]; then\n  echo \"::error::Could not find Apktool.\"\n\
        \  exit 1\nfi\n\ncurl -fsSL \\\n  -o apktool.jar \\\n  \"$APKTOOL_URL\"\n\njava -jar apktool.jar --version\n"
    - name: Verify upstream package
      if: steps.check.outputs.skip == 'false'
      run: "set -euo pipefail\n\nBT=\"$ANDROID_SDK_ROOT/build-tools/34.0.0\"\n\necho \"=== Upstream package ===\"\n\n\"$BT/aapt\"\
        \ dump badging original.apk |\n  grep \"^package:\" || true\n\nPACKAGE=\"$(\n  \"$BT/aapt\" dump badging original.apk\
        \ |\n  sed -n \"s/^package: name='\\([^']*\\)'.*/\\1/p\"\n)\"\n\necho \"Detected: $PACKAGE\"\necho \"Expected: ${ORIGINAL_PACKAGE}\"\
        \n\nif [ \"$PACKAGE\" != \"${ORIGINAL_PACKAGE}\" ]; then\n  echo \"::error::Unexpected upstream package.\"\n  exit\
        \ 1\nfi\n"
    - name: Decompile APK
      if: steps.check.outputs.skip == 'false'
      run: "set -euo pipefail\n\njava -jar apktool.jar \\\n  d original.apk \\\n  -o decoded \\\n  -f\n"
    - name: Patch install identity
      if: steps.check.outputs.skip == 'false'
      env:
        ORIGINAL_PACKAGE: ${{ env.ORIGINAL_PACKAGE }}
        NEW_PACKAGE: ${{ env.NEW_PACKAGE }}
        NEW_APP_LABEL: ${{ env.NEW_APP_LABEL }}
      run: "set -euo pipefail\n\nMANIFEST=\"decoded/AndroidManifest.xml\"\n\nif [ ! -f \"$MANIFEST\" ]; then\n  echo \"::error::AndroidManifest.xml\
        \ not found\"\n  exit 1\nfi\n\necho \"=== Manifest BEFORE ===\"\ngrep -nE \"package=|android:authorities=|permission\"\
        \ \"$MANIFEST\" || true\n\npython3 -c \"import sys; p=sys.argv[1]; old=sys.argv[2]; new=sys.argv[3]; text=open(p,encoding=\\\
        \"utf-8\\\").read(); old_manifest=\\\"package=\\\\\\\"\\\"+old+\\\"\\\\\\\"\\\"; new_manifest=\\\"package=\\\\\\\"\
        \\\"+new+\\\"\\\\\\\"\\\"; \\\nif old_manifest not in text: raise SystemExit(\\\"ERROR: Manifest package \\\\\\\"\\\
        \"+old+\\\"\\\\\\\" was not found\\\"); \\\ntext=text.replace(old_manifest,new_manifest,1); \\\ntext=text.replace(old+\\\
        \".fileprovider\\\",new+\\\".fileprovider\\\"); \\\ntext=text.replace(old+\\\".FileProvider\\\",new+\\\".FileProvider\\\
        \"); \\\ntext=text.replace(old+\\\".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION\\\",new+\\\".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION\\\
        \"); \\\nopen(p,\\\"w\\\",encoding=\\\"utf-8\\\").write(text)\" \\\n  \"$MANIFEST\" \"$ORIGINAL_PACKAGE\" \"$NEW_PACKAGE\"\
        \n\nif [ -f decoded/res/values/strings.xml ]; then\n  python3 -c \"import sys,re; p=sys.argv[1]; label=sys.argv[2];\
        \ text=open(p,encoding=\\\"utf-8\\\").read(); text,count=re.subn(\\\"<string name=\\\\\\\"app_name\\\\\\\">[^<]*</string>\\\
        \",\\\"<string name=\\\\\\\"app_name\\\\\\\">\\\"+label+\\\"</string>\\\",text,count=1); open(p,\\\"w\\\",encoding=\\\
        \"utf-8\\\").write(text) if count else None\" \\\n    \"decoded/res/values/strings.xml\" \"$NEW_APP_LABEL\"\nfi\n\n\
        echo \"=== Manifest AFTER ===\"\ngrep -nE \"package=|android:authorities=|permission\" \"$MANIFEST\" || true\n\nif\
        \ ! grep -q \"package=\\\"${NEW_PACKAGE}\\\"\" \"$MANIFEST\"; then\n  echo \"::error::Manifest package was not changed\"\
        \n  exit 1\nfi\n\nif grep -q \"package=\\\"${ORIGINAL_PACKAGE}\\\"\" \"$MANIFEST\"; then\n  echo \"::error::Original\
        \ package is still the Manifest package\"\n  exit 1\nfi\n\necho \"Install identity patch PASSED\""
    - name: Rebuild APK
      if: steps.check.outputs.skip == 'false'
      run: "set -euo pipefail\n\njava -jar apktool.jar \\\n  b decoded \\\n  -o unsigned.apk\n\ntest -s unsigned.apk\nls -lh\
        \ unsigned.apk\n"
    - name: Verify rebuilt package
      if: steps.check.outputs.skip == 'false'
      env:
        NEW_PACKAGE: ${{ env.NEW_PACKAGE }}
      run: "set -euo pipefail\n\nBT=\"$ANDROID_SDK_ROOT/build-tools/34.0.0\"\n\necho \"=== Rebuilt APK package ===\"\n\n\"\
        $BT/aapt\" dump badging unsigned.apk | grep \"^package:\"\n\nPACKAGE=\"$(\n  \"$BT/aapt\" dump badging unsigned.apk\
        \ |\n  sed -E \"s/^package: name='//; s/'.*$//\"\n)\"\n\necho \"Detected package: $PACKAGE\"\necho \"Expected package:\
        \ $NEW_PACKAGE\"\n\nif [ \"$PACKAGE\" != \"$NEW_PACKAGE\" ]; then\n  echo \"::error::Wrong APK package\"\n  exit 1\n\
        fi\n\necho \"Package verification PASSED\""
    - name: Restore signing key
      if: steps.check.outputs.skip == 'false'
      run: "set -euo pipefail\n\necho \"${{ secrets.KEYSTORE_BASE64 }}\" |\n  base64 -d > release.jks\n\ntest -s release.jks\n"
    - name: Zipalign
      if: steps.check.outputs.skip == 'false'
      run: "set -euo pipefail\n\nBT=\"$ANDROID_SDK_ROOT/build-tools/34.0.0\"\n\n\"$BT/zipalign\" \\\n  -p \\\n  -f \\\n  4\
        \ \\\n  unsigned.apk \\\n  aligned.apk\n"
    - name: Sign APK
      if: steps.check.outputs.skip == 'false'
      run: "set -euo pipefail\n\nBT=\"$ANDROID_SDK_ROOT/build-tools/34.0.0\"\nOUTPUT=\"ArchiveTuneFork-${{ steps.upstream.outputs.tag\
        \ }}.apk\"\n\n\"$BT/apksigner\" sign \\\n  --ks release.jks \\\n  --ks-pass \"pass:${{ secrets.KEYSTORE_PASSWORD }}\"\
        \ \\\n  --out \"$OUTPUT\" \\\n  aligned.apk\n\ntest -s \"$OUTPUT\"\n"
    - name: Final APK verification
      if: steps.check.outputs.skip == 'false'
      env:
        NEW_PACKAGE: ${{ env.NEW_PACKAGE }}
      run: "set -euo pipefail\n\nBT=\"$ANDROID_SDK_ROOT/build-tools/34.0.0\"\nAPK=\"ArchiveTuneFork-${{ steps.upstream.outputs.tag\
        \ }}.apk\"\n\necho \"=== Final package ===\"\n\n\"$BT/aapt\" dump badging \"$APK\" | grep \"^package:\"\n\nPACKAGE=\"\
        $(\n  \"$BT/aapt\" dump badging \"$APK\" |\n  sed -E \"s/^package: name='//; s/'.*$//\"\n)\"\n\necho \"Detected package:\
        \ $PACKAGE\"\n\nif [ \"$PACKAGE\" != \"$NEW_PACKAGE\" ]; then\n  echo \"::error::Final package is wrong\"\n  echo\
        \ \"Expected: $NEW_PACKAGE\"\n  echo \"Actual:   $PACKAGE\"\n  exit 1\nfi\n\necho\necho \"=== Signature ===\"\n\n\"\
        $BT/apksigner\" verify \\\n  --verbose \\\n  \"$APK\"\n\necho\necho \"Final APK verification PASSED\""
    - name: Publish to this repo's Releases
      if: steps.check.outputs.skip == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.upstream.outputs.tag }}
        name: ArchiveTune Fork ${{ steps.upstream.outputs.tag }}
        files: ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk
