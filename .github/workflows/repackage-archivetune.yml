name: Repackage ArchiveTune Fork (Dual Install)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

env:
  UPSTREAM_REPO: rukamori/ArchiveTune

  # 上流APKの package
  ORIGINAL_PACKAGE: moe.rukamori.archivetune

  # Fork APKの package
  NEW_PACKAGE: moe.rukamori.archivetune.fork

  NEW_APP_LABEL: "AT-Fork"

jobs:
  repackage:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ============================================================
      # 1. 最新の安定版Releaseを取得し、正しいアセットを選ぶ
      #
      # ArchiveTuneには GMS版(Cast/GoogleSignIn等を含む) と
      # FOSS版(それらを除いたビルド)、さらに mobile版/tv版が
      # 混在してリリースされている。
      #
      # 優先順位:
      #   1. app-gms-mobile-universal-release.apk (全ABI・GMS機能フル)
      #   2. app-gms-mobile-arm64-release.apk      (universalが無い場合の保険)
      #   3. それ以外の app-gms-mobile-*.apk        (さらに保険)
      #
      # foss / tv は絶対に選ばない。
      # ============================================================
      - name: Find latest upstream release + APK asset
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          latest="$(
            curl -fsSL \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=10" |
            jq -c '
              map(select(.draft == false and .prerelease == false))[0]
            '
          )"

          if [ "$latest" = "null" ] || [ -z "$latest" ]; then
            echo "::error::No stable upstream release found."
            exit 1
          fi

          tag="$(echo "$latest" | jq -r '.tag_name')"

          asset="$(
            echo "$latest" |
            jq -c '
              (.assets | map(select(.name == "app-gms-mobile-universal-release.apk")))[0] //
              (.assets | map(select(.name == "app-gms-mobile-arm64-release.apk")))[0] //
              (.assets | map(select(.name | test("^app-gms-mobile-.*\\.apk$"))))[0] //
              null
            '
          )"

          if [ "$asset" = "null" ] || [ -z "$asset" ]; then
            echo "::error::No GMS mobile APK asset found in release ${tag}"
            echo "::error::Available assets:"
            echo "$latest" | jq -r '.assets[].name'
            exit 1
          fi

          apk_name="$(echo "$asset" | jq -r '.name')"
          apk_url="$(echo "$asset" | jq -r '.browser_download_url')"
          apk_digest="$(echo "$asset" | jq -r '.digest // empty')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "apk_url=$apk_url" >> "$GITHUB_OUTPUT"
          echo "apk_digest=$apk_digest" >> "$GITHUB_OUTPUT"

          echo "Release: $tag"
          echo "Selected asset: $apk_name"
          echo "APK: $apk_url"
          if [ -n "$apk_digest" ]; then
            echo "Expected digest: $apk_digest"
          fi

      # ============================================================
      # 2. 既に処理済みなら終了
      # ============================================================
      - name: Skip if this version was already repackaged
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view \
            "${{ steps.upstream.outputs.tag }}" \
            --repo "${{ github.repository }}" >/dev/null 2>&1
          then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already repackaged. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version detected."
          fi

      # ============================================================
      # 3. APK取得 + 整合性検証
      # ============================================================
      - name: Download upstream APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          echo "Downloading: ${{ steps.upstream.outputs.apk_name }}"

          curl -fL \
            -o original.apk \
            "${{ steps.upstream.outputs.apk_url }}"

          test -s original.apk
          ls -lh original.apk

          EXPECTED="${{ steps.upstream.outputs.apk_digest }}"
          if [ -n "$EXPECTED" ]; then
            ACTUAL="sha256:$(sha256sum original.apk | awk '{print $1}')"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::SHA256 mismatch! Download may be corrupted or tampered."
              exit 1
            fi
            echo "Checksum verification PASSED."
          else
            echo "No digest metadata from GitHub API; skipping checksum verification."
          fi

      # ============================================================
      # 4. Java
      # ============================================================
      - name: Set up JDK 17
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ============================================================
      # 5. Android SDK
      # ============================================================
      - name: Set up Android SDK
        if: steps.check.outputs.skip == 'false'
        uses: android-actions/setup-android@v3

      - name: Install build-tools and apktool
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          sdkmanager \
            "build-tools;34.0.0" \
            --sdk_root="$ANDROID_SDK_ROOT"

          APKTOOL_URL="$(
            curl -fsSL \
              https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |
            jq -r '
              [
                .assets[]
                | select(.name | test("\\.jar$"; "i"))
              ][0].browser_download_url
            '
          )"

          if [ "$APKTOOL_URL" = "null" ] || [ -z "$APKTOOL_URL" ]; then
            echo "::error::Could not find Apktool."
            exit 1
          fi

          curl -fsSL \
            -o apktool.jar \
            "$APKTOOL_URL"

          java -jar apktool.jar --version

      # ============================================================
      # 6. 上流APKのpackageを確認
      # ============================================================
      - name: Verify upstream package
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          echo "=== Upstream package ==="

          "$BT/aapt" dump badging original.apk |
            grep "^package:" || true

          PACKAGE="$(
            "$BT/aapt" dump badging original.apk |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          echo "Detected: $PACKAGE"
          echo "Expected: ${ORIGINAL_PACKAGE}"

          if [ "$PACKAGE" != "${ORIGINAL_PACKAGE}" ]; then
            echo "::error::Unexpected upstream package."
            exit 1
          fi

      # ============================================================
      # 7. Decompile
      # ============================================================
      - name: Decompile APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          java -jar apktool.jar \
            d original.apk \
            -o decoded \
            -f

      # ============================================================
      # 8. パッケージ変更
      #
      # 「必要なものだけ」変更する。
      #
      # Java/Kotlinクラス名は変更しない。
      # Intent actionも変更しない。
      # ============================================================
      - name: Patch install identity
        if: steps.check.outputs.skip == 'false'
        env:
          ORIGINAL_PACKAGE: ${{ env.ORIGINAL_PACKAGE }}
          NEW_PACKAGE: ${{ env.NEW_PACKAGE }}
          NEW_APP_LABEL: ${{ env.NEW_APP_LABEL }}
        run: |
          set -euo pipefail

          MANIFEST="decoded/AndroidManifest.xml"

          test -f "$MANIFEST"

          echo "=== Manifest BEFORE ==="
          grep -nE \
            'package=|android:authorities=|<permission|<uses-permission' \
            "$MANIFEST" || true

          # ----------------------------------------------------------
          # A. Android package ID
          # ----------------------------------------------------------
          sed -i \
            "s/package=\"${ORIGINAL_PACKAGE}\"/package=\"${NEW_PACKAGE}\"/" \
            "$MANIFEST"

          OLD_ESCAPED="${ORIGINAL_PACKAGE//./\\.}"

          # ----------------------------------------------------------
          # B. Provider authority (行単位の汎用置換)
          #
          # fileprovider, androidx-startup, WorkManagerのInitializer等、
          # ContentProviderのauthorityは端末内でユニークである必要があるため、
          # android:authorities= を含む行だけ丸ごと対象にする。
          # ----------------------------------------------------------
          sed -i \
            "/android:authorities=/ s/${OLD_ESCAPED}\./${NEW_PACKAGE}./g" \
            "$MANIFEST"

          # ----------------------------------------------------------
          # C. 独自パーミッション (行単位の汎用置換)
          #
          # DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION などAndroidXが自動生成する
          # 独自パーミッションは、本家とFork双方が同名で宣言すると
          # INSTALL_FAILED_DUPLICATE_PERMISSION でどちらかのインストールが失敗する。
          # ----------------------------------------------------------
          sed -i \
            "/<permission\b/ s/${OLD_ESCAPED}\./${NEW_PACKAGE}./g; \
             /<uses-permission\b/ s/${OLD_ESCAPED}\./${NEW_PACKAGE}./g; \
             /android:permission=/ s/${OLD_ESCAPED}\./${NEW_PACKAGE}./g" \
            "$MANIFEST"

          # ----------------------------------------------------------
          # D. app label (全ロケールのstrings.xmlに反映)
          # ----------------------------------------------------------
          while IFS= read -r -d '' f; do
            if grep -q '<string name="app_name">' "$f"; then
              sed -i \
                "s#<string name=\"app_name\">[^<]*</string>#<string name=\"app_name\">${NEW_APP_LABEL}</string>#" \
                "$f"
            fi
          done < <(find decoded/res -type f -name strings.xml -print0)

          echo "=== Manifest AFTER ==="
          grep -nE \
            'package=|android:authorities=|<permission|<uses-permission' \
            "$MANIFEST" || true

          # package変更が実際に行われたことを確認
          if ! grep -q "package=\"${NEW_PACKAGE}\"" "$MANIFEST"; then
            echo "::error::Manifest package was not changed."
            exit 1
          fi

          if grep -q "package=\"${ORIGINAL_PACKAGE}\"" "$MANIFEST"; then
            echo "::error::Original package still used as Manifest package."
            exit 1
          fi

          echo "Install identity patch OK."

      # ============================================================
      # 9. Rebuild
      # ============================================================
      - name: Rebuild APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          java -jar apktool.jar \
            b decoded \
            -o unsigned.apk

          test -s unsigned.apk
          ls -lh unsigned.apk

      # ============================================================
      # 10. 再ビルド後の package IDを確認
      # ============================================================
      - name: Verify rebuilt package
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          "$BT/aapt" dump badging unsigned.apk |
            grep "^package:"

          PACKAGE="$(
            "$BT/aapt" dump badging unsigned.apk |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          echo "Rebuilt package: $PACKAGE"

          if [ "$PACKAGE" != "${NEW_PACKAGE}" ]; then
            echo "::error::Rebuilt APK has wrong package."
            echo "Expected: ${NEW_PACKAGE}"
            echo "Actual:   ${PACKAGE}"
            exit 1
          fi

          echo "Package verification PASSED."

      # ============================================================
      # 11. GMS機能(Cast/SignIn)がちゃんと含まれているか確認
      # ============================================================
      - name: Verify GMS features are present
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          MANIFEST="decoded/AndroidManifest.xml"

          if ! grep -q "com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" "$MANIFEST"; then
            echo "::error::Cast support is missing from this build."
            echo "::error::Check that the selected upstream asset is the GMS variant, not FOSS."
            exit 1
          fi

          echo "GMS Cast support confirmed present."

      # ============================================================
      # 12. Keystore復元
      # ============================================================
      - name: Restore signing key
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          echo "${{ secrets.KEYSTORE_BASE64 }}" |
            base64 -d > release.jks

          test -s release.jks

      # ============================================================
      # 13. zipalign
      # ============================================================
      - name: Zipalign
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          "$BT/zipalign" \
            -p \
            -f \
            4 \
            unsigned.apk \
            aligned.apk

      # ============================================================
      # 14. Sign
      # ============================================================
      - name: Sign APK
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          OUTPUT="ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk"

          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$OUTPUT" \
            aligned.apk

          test -s "$OUTPUT"

      # ============================================================
      # 15. 最終検証
      # ============================================================
      - name: Final APK verification
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          APK="ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk"

          echo "=== Final package ==="

          "$BT/aapt" dump badging "$APK" |
            grep "^package:"

          PACKAGE="$(
            "$BT/aapt" dump badging "$APK" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          if [ "$PACKAGE" != "${NEW_PACKAGE}" ]; then
            echo "::error::Final package is wrong."
            exit 1
          fi

          echo
          echo "=== Signature ==="

          "$BT/apksigner" verify \
            --verbose \
            "$APK"

          echo
          echo "========================================"
          echo " ArchiveTune Fork verification PASSED"
          echo " Source asset: ${{ steps.upstream.outputs.apk_name }}"
          echo " Package: $PACKAGE"
          echo "========================================"

      # ============================================================
      # 16. Release公開
      # ============================================================
      - name: Publish to this repo's Releases
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: "ArchiveTune Fork ${{ steps.upstream.outputs.tag }}"
          body: |
            Repackaged from upstream asset: `${{ steps.upstream.outputs.apk_name }}`
          files: |
            ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk
